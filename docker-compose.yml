services:
  dq_static:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dq_static
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome

    # Environment variables for database connection, etc.
    # env_file:
    #   - .env

    volumes:
      - ./app:/app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

networks:
  default:
    name: dequa_nw
    external: true
